# bale-vpn-rust — single Rust binary replacing the Node app.
#
# Same binary for headless deployments and the future GUI client.
# CLI: `bale-vpn [--port 3001] [--mode client|server] [--nat-mode
# kernel|userspace] [--headless]`. Build with `--no-default-features`
# to drop the webview dep for a slim server-side binary.
#
# Layers (host-shared crates at the repo top-level):
#   - lktunnel-rust/lktunnel         transport
#   - lk-signaling-rust/lk-signaling trait
#   - bale-signaling-rust/bale-signaling  Bale impl
#
# This crate is the entry point and composition layer over those.
[workspace]
resolver = "2"
members  = ["bale-vpn"]

[workspace.package]
edition = "2021"
publish = false

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

# ─── Stealth patch: local `livekit-api` copy ─────────────────────────────
# Same release as crates.io (0.4.24), wire-identical transport, but the
# join surface matches Bale's own web client instead of the rust-sdks
# fingerprint: protocol=16, no os/device_model/capabilities/
# client_protocol on the v0 query, ClientInfo = {sdk, version, protocol},
# access_token as first query param, and browser handshake headers
# (Origin web.bale.ai + full Chrome UA + Accept-Language) on the signal
# WebSocket. Update this path if `vendor/livekit-api` ever moves.
[patch.crates-io]
livekit-api = { path = "../vendor/livekit-api" }
