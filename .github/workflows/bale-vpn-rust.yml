name: bale-vpn-rust binaries

# CI for the desktop binary that replaced the Node app.
#
#   - push / PR: build ONLY the Linux binary. That is the one that gets
#     deployed (Pouya's VPS runs Ubuntu 22.04), and macOS runners bill
#     at 10x on free-tier minutes. Multi-OS builds only run for a tag
#     or a manual dispatch.
#   - tag `v*`: build all four targets and attach them to the GitHub
#     Release. The release tag is shared with the Android workflow, so
#     a single `git tag v0.1.0 && git push --tags` ships APK + desktop
#     binaries together.
#
# CI runs on EVERY branch, not just main: a fix/* branch sitting for
# days without a single compile check is how a text-carrier patch
# reached "pushed but never built".

on:
  push:
    branches: ['**']
    tags: ['v*']
    # Tag pushes ignore path filters by GitHub's rules, so a release
    # always builds every OS regardless of what changed.
    paths:
      - 'bale-vpn-rust/**'
      - 'lktunnel-rust/**'
      - 'lk-signaling-rust/**'
      - 'bale-signaling-rust/**'
      - 'textcarrier-rust/**'
      - 'vendor/**'
      - '.github/workflows/bale-vpn-rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bale-vpn-rust/**'
      - 'lktunnel-rust/**'
      - 'lk-signaling-rust/**'
      - 'bale-signaling-rust/**'
      - 'textcarrier-rust/**'
      - 'vendor/**'
      - '.github/workflows/bale-vpn-rust.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed for softprops/action-gh-release on tags

# Cancel superseded runs on the same ref (free-tier quota is
# 2000 min/month and macOS runners bill at 10x).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux: the deploy target, runs on every push and PR ────────────
  # ubuntu-22.04 (glibc 2.35), NOT ubuntu-latest: a binary built on
  # 24.04 (glibc 2.39) refuses to load on the 22.04 deploy target with
  # "GLIBC_2.39 not found". Build against the OLDEST glibc we care
  # about; newer distros load it fine.
  linux:
    name: build (linux)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: bale-vpn-rust

    steps:
      - uses: actions/checkout@v4

      # The GUI feature (tao + wry) needs GTK / glib / libsoup /
      # webkit2gtk dev headers on Linux.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libglib2.0-dev libgtk-3-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lktunnel-rust/target
            bale-vpn-rust/target
          key: bale-vpn-rust-ubuntu-22.04-${{ hashFiles('lktunnel-rust/Cargo.lock', 'bale-vpn-rust/Cargo.toml') }}
          restore-keys: |
            bale-vpn-rust-ubuntu-22.04-

      # textcarrier's protocol tests (batching, sliding window, ACK
      # loss) live in-crate. They are the only automated coverage of
      # the wire format, so they gate the build rather than running
      # as an afterthought.
      - name: Run textcarrier unit tests
        run: cargo test -p textcarrier --release -- --nocapture

      # GUI binary — default features (`gui` is on by default;
      # produces the windowed desktop variant). The same binary
      # respects `--headless` at runtime when the user wants the
      # HTTP-only mode on a desktop machine, but the headless build
      # below is the right pick for server deployments where the
      # tao / wry deps would otherwise add ~50MB of native libs.
      - name: cargo build --release  (gui)
        run: cargo build -p bale-vpn --release

      # Headless binary — drops tao + wry. Same source, just the
      # `gui` feature off. Lands as a separate artifact so server
      # deployers can grab a smaller binary without the desktop libs.
      - name: cargo build --release --no-default-features  (headless)
        run: cargo build -p bale-vpn --release --no-default-features

      - name: Stage artifacts
        run: |
          mkdir -p ../release-staging
          cp target/release/bale-vpn ../release-staging/bale-vpn-gui-linux-x86_64
          cp target/release/bale-vpn ../release-staging/bale-vpn-headless-linux-x86_64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bale-vpn-linux-x86_64
          path: release-staging/*
          if-no-files-found: error

  # ── All targets: only for a tag or a manual dispatch ────────────────
  # macos-latest is Apple Silicon (arm64); macos-26-intel is the Intel
  # (x86_64) runner, built natively so the release ships a macOS Intel
  # binary too (the webrtc-rs stack is pure Rust — a plain native build,
  # no cross-compile).
  release:
    name: build (${{ matrix.artifact_os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: linux          # never ship a tag the Linux build rejected
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_os: macos-aarch64
            bin_ext: ''
          - os: macos-26-intel
            artifact_os: macos-x86_64
            bin_ext: ''
          - os: windows-latest
            artifact_os: windows-x86_64
            bin_ext: '.exe'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: bale-vpn-rust

    steps:
      - uses: actions/checkout@v4

      # macos-26-intel (and newer slimmed runner images) don't ship
      # rustup, which dtolnay/rust-toolchain assumes is preinstalled —
      # so the next step can't put cargo on PATH and the build fails
      # with "cargo: command not found". Install rustup if missing.
      - name: Ensure rustup + stable toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version || true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lktunnel-rust/target
            bale-vpn-rust/target
          # Key on matrix.os, not runner.os: both macOS runners report
          # runner.os == "macOS", so a shared key would cross-restore
          # arm64/x86_64 objects.
          key: bale-vpn-rust-${{ matrix.os }}-${{ hashFiles('lktunnel-rust/Cargo.lock', 'bale-vpn-rust/Cargo.toml') }}
          restore-keys: |
            bale-vpn-rust-${{ matrix.os }}-

      - name: cargo build --release  (gui)
        run: cargo build -p bale-vpn --release

      - name: cargo build --release --no-default-features  (headless)
        run: cargo build -p bale-vpn --release --no-default-features

      - name: Stage artifacts
        run: |
          mkdir -p ../release-staging
          cp target/release/bale-vpn${{ matrix.bin_ext }} \
             ../release-staging/bale-vpn-gui-${{ matrix.artifact_os }}${{ matrix.bin_ext }}
          cp target/release/bale-vpn${{ matrix.bin_ext }} \
             ../release-staging/bale-vpn-headless-${{ matrix.artifact_os }}${{ matrix.bin_ext }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bale-vpn-${{ matrix.artifact_os }}
          path: release-staging/*
          if-no-files-found: error

      - name: Attach binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-staging/*