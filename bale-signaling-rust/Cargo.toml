# bale-signaling-rust — Bale-specific impl of the `lk-signaling`
# trait. Owns:
#   * the Bale `.proto` files (single source of truth — Android and
#     Node previously each carried their own copies)
#   * the WebSocket client to next-ws.bale.ai (protobuf-framed, NOT
#     gRPC-web)
#   * the gRPC-web client used for auth + a few side-channel RPCs
#   * `BaleAuth`: SMS OTP + signup + cookie refresh, the irreducibly
#     Bale-shaped flow that doesn't fit a generic trait
#   * `BaleSignaling`: the full `lk_signaling::Signaling` impl
[workspace]
resolver = "2"
members  = ["bale-signaling"]

[workspace.package]
edition = "2021"
publish = false

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

# ─── Stealth patch: local `livekit-api` copy ─────────────────────────────
# Same release as crates.io (0.4.24), wire-identical transport, but the
# join surface matches Bale's own web client instead of the rust-sdks
# fingerprint: protocol=16, no os/device_model/capabilities/
# client_protocol on the v0 query, ClientInfo = {sdk, version, protocol},
# access_token as first query param, and browser handshake headers
# (Origin web.bale.ai + full Chrome UA + Accept-Language) on the signal
# WebSocket. Update this path if `vendor/livekit-api` ever moves.
[patch.crates-io]
livekit-api = { path = "../vendor/livekit-api" }
